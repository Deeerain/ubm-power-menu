name: CI

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # Проверка форматирования кода (можно оставить на быстрой Ubuntu)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt
          override: true

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

  # Совмещенная сборка, тесты и создание Arch-пакета
  build-and-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel cargo pkgconf gtk4 gtk4-layer-shell git

      # Кеширование работает и внутри контейнеров
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Run tests
        run: cargo test

      - name: Build Arch package
        run: |
          # Создаем безопасного пользователя, так как makepkg запрещено пускать из-под root
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder makepkg --syncdeps --noconfirm --skippgpcheck

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

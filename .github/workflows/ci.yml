name: CI & Release

on:
  pull_request:
    branches:
      - main
    tags:
     - 'v*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt
          override: true

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

  build-and-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint
    # Предоставляем права на создание релизов и запись файлов
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel cargo pkgconf gtk4 gtk4-layer-shell git

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Run tests
        run: cargo test

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder makepkg --syncdeps --noconfirm --skippgpcheck

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

      # Этот шаг сработает ТОЛЬКО если сборка запущена из-за создания тега (git tag v1.xx)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.pkg.tar.zst"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
